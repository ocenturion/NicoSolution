<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis Tickets — DORIAN</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        min-height: 100vh;
      }
      .ticket-card {
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
      }
      .qr-img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        background: #fff;
        border-radius: 8px;
        padding: 8px;
      }
      .status-badge.active {
        background: #16a34a;
        color: white;
      }
      .status-badge.used {
        background: #dc2626;
        color: white;
      }
      .status-badge.cancelled {
        background: #6b7280;
        color: white;
      }
      .centered {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (max-width: 576px) {
        .qr-img {
          width: 100px;
          height: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <header class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
          <img
            src="assets/img/logo.png"
            alt="logo"
            style="height: 40px"
            onerror="this.style.display='none'"
          />
          <h4 class="mb-0 text-danger">DORIAN</h4>
        </div>
        <div class="d-none d-md-flex align-items-center gap-2">
          <span id="welcomeUser" class="small text-muted"></span>
          <a href="index.html" class="btn btn-sm btn-outline-secondary"
            ><i class="bi bi-house-door"></i
          ></a>
          <a href="my-tickets.html" class="btn btn-sm btn-outline-success"
            ><i class="bi bi-ticket"></i
          ></a>
          <a
            href="cart.html"
            class="btn btn-sm btn-outline-primary position-relative"
          >
            <i class="bi bi-cart4"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              >1</span
            >
          </a>
          <a href="profile.html" class="btn btn-sm btn-outline-secondary"
            ><i class="bi bi-person"></i
          ></a>
          <a
            href="login.html"
            id="logoutBtn"
            class="btn btn-sm btn-outline-danger"
            ><i class="bi bi-arrow-bar-right"></i
          ></a>
        </div>
      </header>

      <main class="d-flex flex-column align-items-center">
        <div class="col-12 col-md-10 col-lg-8">
          <h5 class="mb-3">Mis tickets</h5>
          <div id="ticketsList" class="row row-cols-1 row-cols-md-2 g-3 mb-4">
            <!-- Cards con tickets -->
          </div>

          <hr />

          <h6 class="mb-3">Historial de compras</h6>
          <div id="ordersHistory" class="list-group">
            <!-- Historial -->
          </div>
        </div>
      </main>

      <!-- MOBILE NAV (visible solo en < md) -->
      <nav
        id="mobileNav"
        class="d-flex d-md-none fixed-bottom bg-white border-top py-2 shadow-sm"
        role="navigation"
      >
        <div
          class="container d-flex justify-content-between align-items-center px-3"
        >
          <a href="index.html" class="text-center text-decoration-none text-muted small nav-item">
            <div><i class="bi bi-house-door fs-4"></i></div>
            <div class="small">Inicio</div>
          </a>
          <a href="my-tickets.html" class="text-center fw-bold text-decoration-none text-muted small nav-item">
            <div><i class="text-primary bi bi-ticket fs-4"></i></div>
            <div class="text-primary small">Tickets</div>
          </a>
          <a
            href="cart.html"
            id="mobileCartBtn"
            class="text-center text-decoration-none text-muted small position-relative nav-item"
          >
            <div><i class="bi bi-cart4 fs-4"></i></div>
            <span
              id="mobileCartCount"
              class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-danger"
              style="transform: translate(0, -50%)"
              >0</span
            >
            <div class="small">Carrito</div>
          </a>
          <a
            href="profile.html"
            class="text-center text-decoration-none text-muted small nav-item"
            aria-label="Perfil (móvil)"
          >
            <div><i class="bi bi-person fs-4"></i></div>
            <div class="small">Perfil</div>
          </a>
          <a
            href="login.html"
            class="text-center text-decoration-none text-muted small nav-item"
          >
            <div><i class="bi bi-arrow-bar-right fs-4 text-danger"></i></div>
            <div class="small text-danger">Salir</div>
          </a>
        </div>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/my-tickets.js"></script>
  </body>
</html>
