<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito de Compras</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container py-4">
      <header class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
          <img
            src="assets/img/logo.png"
            alt="logo"
            style="height: 40px"
            onerror="this.style.display='none'"
          />
          <h4 class="mb-0 text-danger">DORIAN</h4>
        </div>
        <div class="d-none d-md-flex align-items-center gap-2">
          <span id="welcomeUser" class="small text-muted"></span>
          <a href="index.html" class="btn btn-sm btn-outline-secondary"
            ><i class="bi bi-house-door"></i
          ></a>
          <a href="my-tickets.html" class="btn btn-sm btn-outline-success"
            ><i class="bi bi-ticket"></i
          ></a>
          <a
            href="cart.html"
            class="btn btn-sm btn-outline-primary position-relative"
          >
            <i class="bi bi-cart4"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              >1</span
            >
          </a>
          <a href="profile.html" class="btn btn-sm btn-outline-secondary"
            ><i class="bi bi-person"></i
          ></a>
          <a
            href="login.html"
            id="logoutBtn"
            class="btn btn-sm btn-outline-danger"
            ><i class="bi bi-arrow-bar-right"></i
          ></a>
        </div>
      </header>

      <main>
        <div id="cartItems" class="mb-4"></div>
        <div class="text-end">
          <h5>Total: $<span id="cartTotal">0</span></h5>
          <button id="btnCheckout" class="btn btn-success mt-3 px-4">
            Finalizar Compra
          </button>
        </div>
      </main>

      <!-- MOBILE NAV (visible solo en < md) -->
      <nav
        id="mobileNav"
        class="d-flex d-md-none fixed-bottom bg-white border-top py-2 shadow-sm"
        role="navigation"
      >
        <div
          class="container d-flex justify-content-between align-items-center px-3"
        >
          <a
            href="index.html"
            class="text-center text-decoration-none text-muted small nav-item"
            aria-label="Inicio (móvil)"
          >
            <div><i class="bi bi-house-door fs-4"></i></div>
            <div class="small">Inicio</div>
          </a>
          <a
            href="my-tickets.html"
            class="text-center text-decoration-none text-muted small nav-item"
            aria-label="Mis tickets (móvil)"
          >
            <div><i class="bi bi-ticket fs-4"></i></div>
            <div class="small">Tickets</div>
          </a>
          <a href="cart.html" id="mobileCartBtn" class="text-center text-decoration-none text-muted small position-relative nav-item">
            <div><i class="text-primary bi bi-cart4 fs-4"></i></div>
            <span id="mobileCartCount" class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-danger" style="transform: translate(0, -50%)">0</span>
            <div class="text-primary small">Carrito</div>
          </a>
          <a
            href="profile.html"
            class="text-center text-decoration-none text-muted small nav-item"
            aria-label="Perfil (móvil)"
          >
            <div><i class="bi bi-person fs-4"></i></div>
            <div class="small">Perfil</div>
          </a>
          <a
            href="login.html"
            class="text-center text-decoration-none text-muted small nav-item"
          >
            <div><i class="bi bi-arrow-bar-right fs-4 text-danger"></i></div>
            <div class="small text-danger">Salir</div>
          </a>
        </div>
      </nav>
    </div>
    <script src="js/cart.js"></script>
  </body>
</html>
